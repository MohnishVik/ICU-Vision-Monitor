# Model checkpoint paths — all relative to project root
# Runtime prefers finetuned weights; falls back to public if file absent

checkpoints:
  pose:
    yolo_pose: "models/public/yolov8n-pose.pt"            # pretrained, never retrained
  # The other weight paths live next to the code that loads them, in config/signal.yaml:
  #   fall.gru_weights_primary / fall.gru_weights_fallback   (fall GRU)
  #   pain.weights                                           (MobileNetV3, experimental)
  #   learned.rr_lbrd / learned.rr_d435 / learned.hr_efficientphys (learned RR/HR, experimental)
  # The System page and `python main.py` list every expected file and whether it is present.

# Module feature toggles
modules:
  rr:
    use_optical_flow: true
    use_depth: true
    use_thermal: true          # inference only; skipped cleanly if ESP32 offline
    use_tcn: true
    tcn_input_channels: 2      # [optical_flow, depth] — thermal NOT a trained channel
    agreement_gate_bpm: 4.0
  hr:
    use_pos: true              # always on — safety net, no weights
    use_efficientphys: true
    roi_window_frames: 150
    roi_crop_size: 72
  fall:
    use_geometry: true         # depth rules — always on, no weights needed
    use_pose: true
    use_classifier: true
    dwell_s: 1.5
    staff_suppress: true
  pain:
    use_mediapipe_fallback: true   # active until OpenFace installed
    use_openface: false
    inference_priority: ["tcn", "deepmlp", "xgboost"]  # use best available

# Inference device
device: "cuda"      # "cuda" on Jetson, "cpu" for laptop dev
use_onnx: false     # set true on Jetson after running scripts/export_to_onnx.py