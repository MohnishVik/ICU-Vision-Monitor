# Intel RealSense D435
# Exposure and white balance are LOCKED while monitoring: a camera that keeps
# re-adjusting brightness adds steps that rPPG reads as a pulse. In auto_lock mode
# the camera meters the room once at startup, then the values are frozen for the run.

d435:
  rgb:
    width: 640
    height: 480
    fps: 30                    # confirmed from test_realsense_standalone.py
    format: bgr8
  depth:
    width: 424
    height: 240
    fps: 30                    # matched to RGB fps for frame-pair sync
    format: z16
  ir_left:
    width: 848
    height: 480
    fps: 90
  # exposure_mode:
  #   auto_lock - meter the room for auto_lock_settle_s, then freeze exposure/gain/WB (default)
  #   fixed     - always use locked_exposure / locked_gain / locked_white_balance below
  #   auto_lock reproduces the camera's own auto picture by measurement (brightness and
  #   red/blue balance), because many hosts never report the values auto chose. In a dim
  #   room it may also raise gamma / brightness once exposure (33 ms) and gain are maxed.
  exposure_mode: auto_lock
  auto_lock_settle_s: 2.5
  target_luma: null            # null = as bright as camera auto; or a mean level 30-200
  locked_gamma: 300            # neutral tone curve (camera default)
  locked_brightness: 0
  locked_exposure: 156         # fixed mode only; units of 0.1 ms
  locked_gain: 64              # fixed mode only
  locked_white_balance: 4600   # fixed mode only; kelvin
  auto_exposure: false         # never left on while monitoring
  auto_white_balance: false
  mount_distance_m: 1.6        # 1.5–2.0 m from subject, chest-to-face height
  tilt_deg: 15                 # 10–30 degrees downward

# Waveshare ESP32-S3 Thermal Camera
# Sensor: 62x80 pixels, binary HTTP polling
# Raw bytes: 9920 bytes = 62*80*2 (int16, divide by 100 to get Celsius)
# IMPORTANT: Thermal was NOT used in RR training — inference-only signal path
waveshare_thermal:
  enabled: true
  base_ip: "http://192.168.4.1"
  endpoint: "/thermal/frame"   # confirmed active from scan_esp32.py
  full_url: "http://192.168.4.1/thermal/frame"
  frame_width: 80              # confirmed from test_waveshare_thermal.py
  frame_height: 62             # confirmed from test_waveshare_thermal.py
  expected_bytes: 9920         # 62 * 80 * 2 (int16)
  raw_dtype: int16
  celsius_scale: 100.0         # divide raw int16 by 100.0 to get Celsius
  timeout_s: 2.0
  retry_delay_s: 1.0
  display_colormap: COLORMAP_INFERNO
  # Homography to register thermal (62x80) -> RGB (480x640) space
  # Run scripts/calibrate_thermal.py once to compute and paste here
  homography_matrix: null

# Cross-sensor sync
sync:
  tolerance_ms: 33             # max allowed timestamp gap between streams
  ring_buffer_size: 64         # frames held per stream in ring buffer
  thermal_max_age_ms: 250      # newest thermal frame is attached only if <= this old (2 thermal frames)
