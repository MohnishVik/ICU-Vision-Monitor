<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121110" />
    <meta name="description" content="VisionICU - contact-free ICU patient monitoring dashboard" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VisionICU</title>
    <script>
      // apply the saved theme before first paint (no dark flash in light mode)
      try { var t = localStorage.getItem('visionicu.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
